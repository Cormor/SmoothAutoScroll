<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支持开发</title>
<style>
:root { color-scheme: light dark; --accent: #8b5b0e; --font-sans: system-ui, sans-serif; }
html[data-theme=dark] { --accent: #f4ca7f; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font: 16px/1.4 var(--font-sans); }
main { max-width: 780px; margin-inline: auto; padding: clamp(12px, 4vw, 32px); }
.lx-surface { padding: clamp(12px, 3vw, 24px); border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas); border-radius: 14px; }
.lx-button { border: 1px solid; border-radius: 8px; padding: .55em .8em; font: inherit; cursor: pointer; }
.support-cards{display:grid;grid-template-columns:repeat(2,minmax(0,320px));gap:24px;align-items:start;justify-content:center}
.support-card{text-align:center;min-width:0}
.support-card h2{margin-bottom:16px}
.support-page{display:flex;flex-direction:column;--support-code-background:#fff;--support-code-filter:invert(0)}
.support-page .support-heading{flex:none}
.support-page .support-cards{flex:none;margin-block:auto;padding-block:8px}
html[data-theme=dark] .support-page:not(.support-standard){--support-code-background:#000;--support-code-filter:invert(1)}
.support-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.support-heading h1{margin:0}
html[data-theme=light] #supportStandard{display:none}
.support-code{background:var(--support-code-background);padding:24px;aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden}
.support-qr{position:relative;width:100%;aspect-ratio:1}
.support-qr img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.support-code-pattern{filter:var(--support-code-filter)}
.support-amount{color:var(--accent);font:600 28px/1.3 var(--font-sans);font-variant-numeric:tabular-nums;margin:20px 0 0}
@media(max-width:760px){.support-cards{grid-template-columns:minmax(0,320px)}}
</style>
</head>
<body>
<main>
<section id="page-support" class="page settings-page support-page"><div class="support-heading"><h1>支持开发</h1><button id="supportStandard" class="lx-button" aria-pressed="false">标准扫码</button></div>
<div class="support-cards">

<article class="lx-surface support-card">
<h2>支付宝</h2>
<div class="support-code">
<div class="support-qr">
<img class="support-code-pattern" src="assets/alipay-code.png" width="862" height="862" alt="支付宝收款码">
<img class="support-code-marks" src="assets/alipay-marks.png" width="862" height="862" alt="" aria-hidden="true"></div></div>
<p class="support-amount">¥5.98</p>
</article>

<article class="lx-surface support-card">
<h2>微信</h2>
<div class="support-code">
<div class="support-qr">
<img class="support-code-pattern" src="assets/wechat-code.png" width="576" height="576" alt="微信赞赏码，建议金额6元">
<img class="support-code-marks" src="assets/wechat-marks.png" width="576" height="576" alt="" aria-hidden="true"></div></div>
<p class="support-amount">建议 ¥6</p>
</article></div></section>
</main>
<script>
const theme = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  document.documentElement.dataset.theme = theme.matches ? "dark" : "light";
}
applyTheme();
theme.addEventListener("change", applyTheme);
const page = document.getElementById("page-support");
const standard = document.getElementById("supportStandard");
standard.addEventListener("click", () => {
  const enabled = page.classList.toggle("support-standard");
  standard.setAttribute("aria-pressed", String(enabled));
});
</script>
</body>
</html>
